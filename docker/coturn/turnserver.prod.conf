# Production TURN/STUN relay config.
#
# realm and static-auth-secret are NOT set here — they're passed as CLI flags
# from docker-compose.prod.yml (--realm / --static-auth-secret), sourced from
# .env.production, so the shared secret never has to be committed to the repo.
listening-port=3478

min-port=49152
max-port=49999

use-auth-secret
lt-cred-mech
fingerprint
no-cli
no-multicast-peers
no-loopback-peers

# If the host is behind cloud NAT (private + public IP are different, e.g.
# AWS/GCP/most managed cloud VMs), uncomment and fill in both addresses so
# coturn advertises the public IP in relay candidates:
# external-ip=<PRIVATE_IP>/<PUBLIC_IP>

# Public-facing relay: deny relaying to internal/link-local ranges so this
# TURN server can't be abused to reach the host's private network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255

# MVP: plain TURN over UDP/TCP on 3478 (media itself is already DTLS/SRTP
# encrypted end-to-end; TURNS mainly helps bypass networks that block UDP by
# disguising TURN as HTTPS on 443, which isn't a requirement here yet).
# To add TURNS later: obtain a cert for $DOMAIN_NAME (e.g. via certbot, since
# Caddy's own certs aren't stored in a coturn-readable format by default),
# then uncomment:
# tls-listening-port=5349
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
no-tls
no-dtls
