# Local dev TURN server. The static-auth-secret below MUST match
# TURN_SHARED_SECRET in this project's .env — that's how the Nest server's
# time-limited credentials (see src/ice-servers/turn-credentials.util.ts)
# are accepted by coturn.
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

use-auth-secret
static-auth-secret=change-me-dev-only
realm=larprich.local

lt-cred-mech
fingerprint
no-cli
no-multicast-peers

# Dev-only: no real TLS cert is set up locally, so plain TURN/UDP+TCP is
# what clients will actually negotiate. Fine for local testing; a real
# deployment should terminate TLS and drop this line.
no-tls
no-dtls
